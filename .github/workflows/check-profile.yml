name: Check profile against the Games catalog

# Fails (and GitHub emails Mike) if a live or in-progress game in the website's
# _data/games.yml is missing from profile/README.md.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 15 * * 1' # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-profile.js
